name: Publish to pub.dev

# Publishes the one package named by the tag this run is on
# (<package>-v<version>, e.g. flame_gallery_core-v0.2.0). Normally started by
# release.yml after a merge to main; pushing such a tag by hand works too.
#
# pub.dev admin -> Automated publishing, per package: repository
# VB10/flutter_flame_gallery, tag pattern <package>-v{{version}}, and
# "Enable publishing from workflow_dispatch events" (release.yml dispatches
# this workflow on the tag). The first version of every package must be
# published by hand.
on:
  push:
    tags:
      - "flame_gallery_core-v[0-9]+.[0-9]+.[0-9]+*"
      - "flame_gallery_slice-v[0-9]+.[0-9]+.[0-9]+*"
      - "flame_gallery_runner-v[0-9]+.[0-9]+.[0-9]+*"
      - "flame_gallery_match-v[0-9]+.[0-9]+.[0-9]+*"
      - "flame_gallery_rhythm-v[0-9]+.[0-9]+.[0-9]+*"
      - "flame_gallery-v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve package from tag
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.tag.outputs.package }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo "::error::Run this workflow on a <package>-v<version> tag, not on a branch."
            exit 1
          fi
          echo "package=$(tool/release.sh check-tag "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve
    permissions:
      id-token: write
    uses: ./.github/workflows/_publish_package.yml
    with:
      package: ${{ needs.resolve.outputs.package }}
