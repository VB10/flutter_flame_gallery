  flame: ^1.38.2
  flame_gallery_core: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flame_test: ^2.3.1
  very_good_analysis: ^11.0.0

flutter:
  assets:
    - assets/images/
